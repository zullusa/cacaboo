apiVersion: 1

datasources:
  - name: VictoriaMetrics
    uid: victoriametrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "15s"

  - name: OpenSearch
    uid: opensearch
    type: opensearch
    access: proxy
    url: http://opensearch:9200
    database: "logs-*"
    editable: true
    jsonData:
      version: "2.11.1"
      flavor: opensearch
