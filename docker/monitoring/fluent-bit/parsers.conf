[PARSER]
    Name        nginx
    Format      regex
    Regex       ^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)")?$
    Time_Key    time
    Time_Format %d/%b/%Y:%H:%M:%S %z

[PARSER]
    Name        nginx_error
    Format      regex
    Regex       ^(?<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?<level>\w+)\] \d+#\d+: \*(?<cid>\d+) (?<message>.*)$
    Time_Key    time
    Time_Format %Y/%m/%d %H:%M:%S

[PARSER]
    Name        php_errors
    Format      regex
    Regex       ^\[(?<time>[^\]]+)\] PHP (?<level>\w+):\s+(?<message>.*)$
    Time_Key    time
    Time_Format %d-%b-%Y %H:%M:%S %z

[PARSER]
    Name        ci_app
    Format      regex
    Regex       ^(?<level>[A-Z]+) - (?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) --> (?<message>.*)$
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S