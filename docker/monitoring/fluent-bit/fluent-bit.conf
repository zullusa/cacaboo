[SERVICE]
    Flush           5
    Daemon          Off
    Log_Level       info
    Parsers_File    parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    Health_Check    On

[INPUT]
    Name              tail
    Tag               docker.*
    Path              /var/log/containers/*/*-json.log
    Parser            docker
    DB                /var/log/flb_docker.db
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    Read_from_Head    true

[INPUT]
    Name              tail
    Tag               nginx.*
    Path              /var/log/nginx/*.log
    Parser            nginx
    DB                /var/log/flb_nginx.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[INPUT]
    Name              tail
    Tag               ci-app.*
    Path              /var/log/ci-app/*.log
    Parser            ci_app
    DB                /var/log/flb_ci.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  10

[FILTER]
    Name          modify
    Match         docker.*
    Remove        log
    Add           source docker

[FILTER]
    Name          modify
    Match         nginx.*
    Add           source nginx

[FILTER]
    Name          modify
    Match         ci-app.*
    Add           source ci-app

[OUTPUT]
    Name            opensearch
    Match           *
    Host            opensearch
    Port            9200
    Logstash_Format On
    Logstash_Prefix logs
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name On
    Retry_Limit     5
    Replace_Dots    On

[OUTPUT]
    Name            prometheus_exporter
    Match           *
    Host            0.0.0.0
    Port            2021
