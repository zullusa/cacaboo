[SERVICE]
    Flush           1
    Daemon          Off
    Log_Level       info
    Parsers_File    parsers.conf
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    Health_Check    On

# Регистрирует логи бизнес-сервисов: каждый шлёт их через Docker fluentd
# log driver (см. logging: в docker-compose.yml). Тег = имя сервиса.
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Max_Size   1M

# Логи nginx (volume nginx-logs, файлы, не /dev/stdout).
[INPUT]
    Name              tail
    Tag               nginx.access
    Path              /var/log/nginx/application.access.log
    Parser            nginx
    DB                /var/log/flb_nginx_access.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    Read_from_Head    false

[INPUT]
    Name              tail
    Tag               nginx.error
    Path              /var/log/nginx/application.error.log
    Parser            nginx_error
    DB                /var/log/flb_nginx_error.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    Read_from_Head    false

# Ошибки PHP-приложения (fastcgi_param error_log в nginx.conf).
[INPUT]
    Name              tail
    Tag               php.errors
    Path              /var/log/nginx/application_php_errors.log
    Parser            php_errors
    DB                /var/log/flb_php_errors.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    Read_from_Head    false

# Логи CodeIgniter-приложения (storage/logs/*.php).
[INPUT]
    Name              tail
    Tag               ci-app
    Path              /var/log/ci-app/*.php
    Parser            ci_app
    DB                /var/log/flb_ci.db
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On
    Refresh_Interval  10
    Read_from_Head    false

# Docker fluentd driver присылает сообщение в поле `log`, а сервис —
# в теге сообщения. Нормализуем: log -> message, service из тега.
[FILTER]
    Name          modify
    Match         *
    Rename        log message

[FILTER]
    Name          lua
    Match         *
    call          set_service
    script        /fluent-bit/etc/set_service.lua

# Nginx и CodeIgniter логи попадают из файлов, помечаем сервис по входу.
[FILTER]
    Name          modify
    Match         nginx.*
    Add           service nginx

[FILTER]
    Name          modify
    Match         php.errors
    Add           service php-fpm

[FILTER]
    Name          modify
    Match         ci-app
    Add           service php-fpm

[OUTPUT]
    Name            opensearch
    Match           *
    Host            opensearch
    Port            9200
    Logstash_Format On
    Logstash_Prefix logs
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name On
    Retry_Limit     5
    Replace_Dots    On
    Workers         2

[OUTPUT]
    Name            prometheus_exporter
    Match           *
    Host            0.0.0.0
    Port            2021