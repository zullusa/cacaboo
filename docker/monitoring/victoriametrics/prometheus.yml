global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "victoriametrics"
    static_configs:
      - targets: ["victoriametrics:8428"]

  - job_name: "sms-service"
    static_configs:
      - targets: ["sms-service:8001"]
    metrics_path: /metrics

  - job_name: "reminder-worker"
    static_configs:
      - targets: ["reminder-worker:8002"]
    metrics_path: /metrics

  - job_name: "backup-worker"
    static_configs:
      - targets: ["backup-worker:8003"]
    metrics_path: /metrics

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics

  - job_name: "mysqld-exporter"
    static_configs:
      - targets: ["mysqld-exporter:9104"]
    metrics_path: /metrics

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
    metrics_path: /metrics

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: /metrics

  - job_name: "fluent-bit"
    static_configs:
      - targets: ["fluent-bit:2020"]
    metrics_path: /api/v1/metrics/prometheus

  - job_name: "opensearch"
    static_configs:
      - targets: ["opensearch-exporter:9114"]
    metrics_path: /metrics
