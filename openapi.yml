                      type: string
                    company_zip_code:
                      type: string
                    company_country:
                      type: string
      responses:
        '200':
          description: Empty body while installed; installation result JSON otherwise.

  /console/cleanup:
    post:
      tags:
        - backend_misc
      summary: Runs the system cleanup routine.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token]
              properties:
                csrf_token:
