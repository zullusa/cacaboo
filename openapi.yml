  /calendar/save_appointment:
    post:
      tags:
        - backend_calendar
      summary: >
        Inserts or updates an appointment from the calendar dialog. Reuses an
        existing customer matched by phone number or email.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, appointment_data]
              properties:
                csrf_token:
                  type: string
                appointment_data:
                  type: object
                  description: Sent as form-encoded nested fields (key[subkey]=value).
                  properties:
                    id:
                      type: integer
                    id_users_provider:
                      type: integer
                    id_users_customer:
                      type: integer
                    id_services:
                      type: integer
                    is_unavailability:
                      type: integer
                    start_datetime:
                      type: string
                    end_datetime:
                      type: string
                    car_make:
                      type: string
                    car_plate:
                      type: string
                    notes:
                      type: string
                    location:
                      type: string
                customer_data:
                  type: object
                  nullable: true
                  description: Optional customer data, sent as form-encoded nested fields (key[subkey]=value).
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
                    email:
                      type: string
                    phone_number:
                      type: string
                    address:
                      type: string
                    city:
                      type: string
                    zip_code:
                      type: string
                    notes:
                      type: string
                notify_users:
                  type: boolean
                  default: true
                force_save:
                  type: boolean
                  description: Save even when the provider has conflicting appointments.
      responses:
        '200':
          description: Save result (may return a conflict flag).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  conflict:
                    type: boolean
