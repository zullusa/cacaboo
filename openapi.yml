  /calendar/get_calendar_appointments:
    post:
      tags:
        - backend_calendar
      summary: Gets the calendar events of the selected filter item between two dates.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, start_date, end_date]
              properties:
                csrf_token:
                  type: string
                record_id:
                  type: integer
                filter_type:
                  type: string
                start_date:
                  type: string
                  example: '2025-01-01'
                end_date:
                  type: string
                  example: '2025-01-31'
      responses:
        '200':
          description: Calendar events grouped by record type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items:
                      type: object
                  unavailabilities:
                    type: array
                    items:
                      type: object
                  events:
                    type: array
                    items:
                      type: object

