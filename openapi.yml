        '200':
          description: Login page HTML.

  /login/validate:
    post:
      tags:
        - backend_auth
      summary: Validates the credentials and starts a session.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password, csrf_token]
              properties:
                username:
                  type: string
                password:
                  type: string
                csrf_token:
                  type: string
      responses:
        '200':
          description: Session cookie set on success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '401':
          description: Invalid credentials.

  /logout:
    get:
      tags:
        - backend_auth
      summary: Destroys the current session and redirects to the login page.
      responses:
        '302':
          description: Redirect to the login page.

  /localization/change_language:
    post:
      tags:
        - backend_auth
      summary: Changes the session language.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf_token, language]
              properties:
                csrf_token:
                  type: string
                language:
                  type: string
      responses:
        '200':
          description: OK

