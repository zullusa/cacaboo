services:
  php-fpm:
    build: docker/php-fpm
    working_dir: /var/www/html
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - BASE_URL=${BASE_URL}
      - LANGUAGE=${DEFAULT_LANGUAGE}
      - DEBUG_MODE=${DEBUG_MODE}
      - APP_ENV=${APP_ENV}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USERNAME=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - RABBITMQ_ENABLED=${RABBITMQ_ENABLED}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - RABBITMQ_QUEUE=${RABBITMQ_QUEUE:-notifications_dev}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
      - RABBITMQ_ROUTING_KEY=${RABBITMQ_ROUTING_KEY}
      - GOOGLE_SYNC_FEATURE=${GOOGLE_SYNC_FEATURE}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ADDRESS=${ADDRESS}
      - CONTACT_PHONE=${CONTACT_PHONE}
      - REMINDER_TYPE=${WORKER_TYPE}
      - REMINDER_SUBJECT=${WORKER_SUBJECT}
      - REMINDER_PHONE_PREFIX=${REMINDER_PHONE_PREFIX}
    volumes:
      - '.:/var/www/html'
      - './docker/php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini'
    depends_on:
      - mysql

  nginx:
    image: 'nginx:1.23.3-alpine'
    working_dir: /var/www/html
    volumes:
      - '.:/var/www/html'
      - './docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
      - 'nginx-logs:/var/log/nginx'
    ports:
      - '${NGINX_PORT:-80}:80'
    depends_on:
      - php-fpm
    networks:
      - default
      - monitoring

  mysql:
    image: 'mysql:8.0'
    volumes:
      - './docker/mysql:/var/lib/mysql'
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    command: >
      --performance-schema=ON
      --slow-query-log=ON
      --slow-query-log-file=/var/lib/mysql/slow.log
      --long-query-time=2
    networks:
      - default
      - monitoring

  phpmyadmin:
    image: 'phpmyadmin:5.2.1'
    ports:
      - '${PHPMYADMIN_PORT:-8088}:80'
    environment:
      - 'PMA_HOST=mysql'
      - 'UPLOAD_LIMIT=102400K'
    depends_on:
      - mysql

  reminder-worker:
    build: docker/reminder-worker
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USERNAME=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_PREFIX=${DB_PREFIX}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USERNAME=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - RABBITMQ_QUEUE=${RABBITMQ_QUEUE:-notifications_dev}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
      - RABBITMQ_ROUTING_KEY=${RABBITMQ_ROUTING_KEY}
      - RABBITMQ_NOTIFIED_QUEUE=${RABBITMQ_NOTIFIED_QUEUE:-notified_dev}
      - RABBITMQ_NOTIFIED_EXCHANGE=${RABBITMQ_NOTIFIED_EXCHANGE:-notified_exchange_dev}
      - RABBITMQ_NOTIFIED_ROUTING_KEY=${RABBITMQ_NOTIFIED_ROUTING_KEY:-notified_dev}
      - RABBITMQ_HEARTBEAT=${RABBITMQ_HEARTBEAT:-60}
      - TIMEZONE=${WORKER_TIMEZONE}
      - POLL_INTERVAL=${WORKER_POLL_INTERVAL}
      - REMINDER_OFFSETS=${WORKER_REMINDER_OFFSETS}
      - TOLERANCE_SECONDS=${WORKER_TOLERANCE_SECONDS}
      - REMINDER_TYPE=${WORKER_TYPE}
      - REMINDER_SUBJECT=${WORKER_SUBJECT}
      - REMINDER_STATUS_NOTIFIED=${REMINDER_STATUS_NOTIFIED:-Оповещен}
      - REMINDER_STATUS_BOOKED=${REMINDER_STATUS_BOOKED:-Записано}
      - REMINDER_STATUS_ERROR=${REMINDER_STATUS_ERROR:-Ошибка}
      - REMINDER_STATUS_OFFSET=${REMINDER_STATUS_OFFSET:-1}
      - REMINDER_PHONE_PREFIX=${REMINDER_PHONE_PREFIX:-+7}
      - ADDRESS=${ADDRESS}
      - CONTACT_PHONE=${CONTACT_PHONE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY}
      - METRICS_PORT=${REMINDER_METRICS_PORT:-8002}
    ports:
      - '${REMINDER_METRICS_PORT:-8002}:8002'
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - default
      - monitoring

  backup-worker:
    build: docker/backup-worker
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USERNAME=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - TIMEZONE=${WORKER_TIMEZONE}
      - BACKUP_TIME=${BACKUP_TIME:-02:00}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_RUN_ON_START=${BACKUP_RUN_ON_START:-false}
      - BACKUP_NAME_PREFIX=${BACKUP_NAME_PREFIX:-cacaboo}
      - SMB_HOST=${SMB_HOST}
      - SMB_PORT=${SMB_PORT:-445}
      - SMB_SHARE=${SMB_SHARE}
      - SMB_PATH=${SMB_PATH:-/}
      - SMB_USERNAME=${SMB_USERNAME}
      - SMB_PASSWORD=${SMB_PASSWORD}
      - SMB_PROTOCOL=${SMB_PROTOCOL:-SMB3}
      - METRICS_PORT=${BACKUP_METRICS_PORT:-8003}
    ports:
      - '${BACKUP_METRICS_PORT:-8003}:8003'
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - default
      - monitoring

  sms-service:
    build: sms-service
    environment:
      - SMS_PROVIDER=${SMS_PROVIDER:-keenetic}
      - MODEM_NAME=${MODEM_NAME:-UsbQmi0}
      - MODEM_USER=${MODEM_USER:-samsa}
      - MODEM_PASSWORD=${MODEM_PASSWORD:-samsa}
      - MODEM_URL_BASE=${MODEM_URL_BASE:-http://192.168.0.1}
      - SMSAERO_EMAIL=${SMSAERO_EMAIL}
      - SMSAERO_CHANNEL=${SMSAERO_CHANNEL}
      - SMS_GATE_API_KEY=${SMS_GATE_API_KEY}
      - SMS_GATE_FROM=${SMS_GATE_FROM}
      - SMS_GATE_STATUS_TIMEOUT=${SMS_GATE_STATUS_TIMEOUT:-120}
      - SMS_GATE_STATUS_POLL_INTERVAL=${SMS_GATE_STATUS_POLL_INTERVAL:-10}
      - SMS_STATUS_MAX_RETRIES=${SMS_STATUS_MAX_RETRIES:-3}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST}
      - RABBITMQ_QUEUE=${RABBITMQ_QUEUE:-notifications}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE}
      - RABBITMQ_ROUTING_KEY=${RABBITMQ_ROUTING_KEY}
      - RABBITMQ_NOTIFIED_QUEUE=${RABBITMQ_NOTIFIED_QUEUE:-notified_dev}
      - RABBITMQ_NOTIFIED_EXCHANGE=${RABBITMQ_NOTIFIED_EXCHANGE:-notified_exchange_dev}
      - RABBITMQ_NOTIFIED_ROUTING_KEY=${RABBITMQ_NOTIFIED_ROUTING_KEY:-notified_dev}
      - SMS_DELAYED_QUEUE=${SMS_DELAYED_QUEUE:-sms_delayed}
      - SMS_SEND_WORKERS=${SMS_SEND_WORKERS:-4}
      - SMS_STATUS_WORKERS=${SMS_STATUS_WORKERS:-4}
      - SMS_DRAIN_INTERVAL=${SMS_DRAIN_INTERVAL:-1.0}
      - SMS_POLL_CRON=${SMS_POLL_CRON:-* * * * *}
      - SMS_IGNORE_SENDER=${SMS_IGNORE_SENDER:-MegaFon}
      - SMS_IGNORE_KEYWORDS=${SMS_IGNORE_KEYWORDS:-код подтверждения,код для входа,ваш код}
      - SMS_MNO_LOOKUP_URL=${SMS_MNO_LOOKUP_URL:-https://www.kody.su/check-tel}
      - SMS_MNO_LOOKUP_TIMEOUT=${SMS_MNO_LOOKUP_TIMEOUT:-15}
      - SMS_OPERATOR_DB_PATH=${SMS_OPERATOR_DB_PATH:-/app/data/operators.db}
      - SMS_OPERATOR_TTL_DAYS=${SMS_OPERATOR_TTL_DAYS:-7}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY}
    ports:
      - '${SMS_METRICS_PORT:-8901}:8001'
    volumes:
      - './docker/sms/data:/app/data'
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - default
      - monitoring

  keenetic-mock:
    build: docker/keenetic-mock
    ports:
      - '${KEENETIC_MOCK_PORT:-18080}:8080'
    environment:
      - MODEM_USER=${MODEM_USER:-samsa}
      - MODEM_PASSWORD=${MODEM_PASSWORD:-samsa}
    restart: unless-stopped

  swagger-ui:
    platform: linux/amd64
    image: swaggerapi/swagger-ui:v5.10.5
    ports:
      - "${SWAGGER_UI_PORT:-8000}:8080"
    volumes:
      - ./openapi.yml:/usr/share/nginx/html/openapi.yml
    environment:
      API_URL: openapi.yml
    depends_on:
      - php-fpm

  # ─────────────────────────────────────────────────────────────────────
  # Monitoring stack (VictoriaMetrics + Grafana)
  # ─────────────────────────────────────────────────────────────────────

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    restart: unless-stopped
    command:
      - '-promscrape.config=/etc/victoriametrics/prometheus.yml'
      - '-retentionPeriod=${VM_RETENTION_PERIOD:-30d}'
      - '-storageDataPath=/victoria-metrics-data'
      - '-search.queryTimeout=30s'
    volumes:
      - './docker/monitoring/victoriametrics/prometheus.yml:/etc/victoriametrics/prometheus.yml:ro'
      - 'victoriametrics-data:/victoria-metrics-data'
    ports:
      - '${VICTORIAMETRICS_PORT:-8428}:8428'
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_PROVISIONING_ENABLED=true
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-admin}
    volumes:
      - 'grafana-data:/var/lib/grafana'
      - './docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro'
      - './docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro'
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    depends_on:
      - victoriametrics
    networks:
      - monitoring

  telegram-alertbot:
    build: docker/monitoring/telegram-alertbot
    container_name: telegram-alertbot
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - TELEGRAM_PROXY=${TELEGRAM_PROXY}
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
    ports:
      - '${NODE_EXPORTER_PORT:-9100}:9100'
    networks:
      - monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - '/:/rootfs:ro'
      - '/var/run:/var/run:ro'
      - '/sys:/sys:ro'
      - '/var/lib/docker/:/var/lib/docker:ro'
      - '/dev/disk/:/dev/disk:ro'
    devices:
      - /dev/kmsg
    ports:
      - '${CADVISOR_PORT:-9105}:8080'
    networks:
      - monitoring

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/
    ports:
      - '${MYSQL_EXPORTER_PORT:-9104}:9104'
    depends_on:
      - mysql
    networks:
      - default
      - monitoring

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: nginx-exporter
    restart: unless-stopped
    command:
      - '-nginx.scrape-uri=http://nginx:8080/stub_status'
    ports:
      - '${NGINX_EXPORTER_PORT:-9113}:9113'
    depends_on:
      - nginx
    networks:
      - default
      - monitoring

  # ─────────────────────────────────────────────────────────────────────
  # Logging stack (OpenSearch + Fluent Bit)
  # ─────────────────────────────────────────────────────────────────────

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      # Security plugin is disabled by default so HTTP works out of the box.
      # For a production setup set OPENSEARCH_DISABLE_SECURITY=false and use
      # HTTPS everywhere (see prometheus.yml, fluent-bit.conf, datasources.yml).
      - DISABLE_SECURITY_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-opensearch}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - 'opensearch-data:/usr/share/opensearch/data'
    ports:
      - '${OPENSEARCH_PORT:-9200}:9200'
    networks:
      - monitoring

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: opensearch-dashboards
    restart: unless-stopped
    environment:
      - 'OPENSEARCH_HOSTS=http://opensearch:9200'
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=${OPENSEARCH_DISABLE_SECURITY:-true}
    ports:
      - '${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601'
    depends_on:
      - opensearch
    networks:
      - monitoring

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: fluent-bit
    restart: unless-stopped
    environment:
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-opensearch}
    volumes:
      - './docker/monitoring/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro'
      - './docker/monitoring/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro'
      - '/var/lib/docker/containers:/var/log/containers:ro'
      - 'nginx-logs:/var/log/nginx:ro'
      - './storage/logs:/var/log/ci-app:ro'
    ports:
      - '${FLUENTBIT_METRICS_PORT:-2020}:2020'
    depends_on:
      - opensearch
    networks:
      - monitoring

  opensearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.7.0
    container_name: opensearch-exporter
    restart: unless-stopped
    command:
      - '--es.uri=http://opensearch:9200'
      - '--es.timeout=10s'
    ports:
      - '${OPENSEARCH_EXPORTER_PORT:-9115}:9115'
    depends_on:
      - opensearch
    networks:
      - monitoring

volumes:
  victoriametrics-data:
  grafana-data:
  opensearch-data:
  nginx-logs:

networks:
  monitoring:
    name: monitoring

